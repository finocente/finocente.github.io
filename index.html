<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>finocente · redirigiendo a webapp_redis</title>
<style>
body{background:#0f1115;color:#e6e9ef;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:90vh;margin:0;text-align:center;padding:20px}
div{max-width:600px}
a{color:#4f8cff}
.estado{color:#8b93a7;font-size:14px;margin-top:14px}
.spin{width:26px;height:26px;border:3px solid #1e293b;border-top-color:#4f8cff;border-radius:50%;margin:0 auto 12px;animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div>
  <div class="spin"></div>
  <p>Redirigiendo a <strong>webapp_redis</strong> (servidor maestro)…</p>
  <p class="estado" id="estado">Buscando la URL actual por MQTT…</p>
  <p class="estado">Si no carga, prueba:
    <a id="ngrok" href="#">ngrok ↗</a> ·
    <a id="funnel" href="#">Funnel ↗</a> ·
    <a id="lan" href="#">LAN ↗</a>
  </p>
</div>

<script>
var TOPIC = "redajedrez/url";
var BROKER = "broker.emqx.io";
var PUERTO_WSS = 8084;
var SEG = 30;
var ESPERA_MAX = 9000;
var CONOCIDAS = [
  "https://7141-109-227-142-196.ngrok-free.app/",
  "https://uefi-x86.tail11334a.ts.net/"
];
var LAN = "http://192.168.1.113:5000";

var mejorUrl = null;
var mejorTs = 0;
var estadoEl = document.getElementById("estado");

function estado(t) { if (estadoEl) estadoEl.textContent = t; }

function fresca(m) {
  var ahora = Math.floor(Date.now() / 1000);
  return m && m.tipo === "url" && m.url && Math.abs(ahora - (m.ts || 0)) < 2 * SEG;
}

function ir(url) {
  if (!url) return;
  document.body.innerHTML = "<p>Redirigiendo a <a href=\"" + url + "\">" + url + "</a>…</p>";
  location.replace(url);
}

function decidir() {
  if (mejorUrl) return ir(mejorUrl);
  estado("MQTT sin señal; usando URL conocida…");
  ir(CONOCIDAS[0]);
}

function cargarMqtt() {
  var fuentes = [
    "https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js",
    "https://unpkg.com/mqtt@5/dist/mqtt.min.js"
  ];
  var i = 0;
  function intentar() {
    if (i >= fuentes.length) return decidir();
    var s = document.createElement("script");
    s.src = fuentes[i++];
    s.onload = function () { if (window.mqtt) arrancar(); else intentar(); };
    s.onerror = intentar;
    document.head.appendChild(s);
  }
  intentar();
}

function arrancar() {
  estado("Conectando a MQTT (" + BROKER + ":" + PUERTO_WSS + ")…");
  var cliente;
  try {
    cliente = mqtt.connect("wss://" + BROKER + ":" + PUERTO_WSS + "/mqtt", {
      keepalive: 30,
      reconnectPeriod: 3000,
      clean: true
    });
  } catch (e) {
    return decidir();
  }
  cliente.on("connect", function () { cliente.subscribe(TOPIC); });
  cliente.on("message", function (topic, payload) {
    try {
      var m = JSON.parse(payload.toString());
      if (fresca(m) && (m.ts || 0) >= mejorTs) {
        mejorTs = m.ts;
        mejorUrl = m.url;
        estado("Servidor encontrado por MQTT: " + m.url);
      }
    } catch (e) { /* ignorar */ }
  });
  cliente.on("error", function (e) {
    estado("Error MQTT, usando URL conocida…");
  });
  setTimeout(decidir, ESPERA_MAX);
}

document.getElementById("ngrok").href = CONOCIDAS[0];
document.getElementById("funnel").href = CONOCIDAS[1];
document.getElementById("lan").href = LAN;
cargarMqtt();
</script>
</body>
</html>
